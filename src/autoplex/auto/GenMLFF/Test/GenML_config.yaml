#Parameters for the ensemble evaluator
ensemble_params:
  "mlip_type": "MACE"
  "mlip_paths": []
  "mlip_errors": []
  "mlip_kwargs": {
      "device" : "cuda", 
      "default_dtype" : "float32",
      }
  "pre_trained_model": "/leonardo_work/EUHPC_A04_113/Alberto/mace/pre-trained-models/mace-mpa-0-medium.model"
  "pre_trained_kwargs": {
      "device" : "cuda", 
      "default_dtype" : "float32",
  }

#Parameters for QuantumEspresso scf runs
qe_params:
  "qe_run_cmd": "mpirun -np 1 pw.x"
  "num_qe_workers": 2 #Number of workers to use for the calculations. If None setp up 1 worker per scf
  "fname_pwi_template": "/leonardo_work/EUHPC_A04_113/Alberto/GenMLFF-progect/Test-workflow/rss-mlip/reference.pwi" #Path to file containing the template QE input
  "kspace_resolution": 0.3 #K-space resolution for the QE calculations in Å^-1
  "koffset": [False, False, False] #K-point offset for the QE calculations

