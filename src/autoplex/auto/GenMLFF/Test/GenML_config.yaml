  "pre_database_dir" : None
  "init_database_dir" : None
  "num_models": 4
  "test_ratio": 0.05
  "distill_force_max": 20.0 #eV/Å


#Parameters for ensemble training
#Define parameters for ensemble training
train_params:
    "num_models": 4
    "remove_model_datasets": True
    "mlip_type": "MACE"
    "mlip_train_kwargs": {
        "device": "cuda",
        "batch_size": 2,
        "max_num_epochs": 10,
        "swa": False,
        "E0s": "{6 : -561.5463794436}",
        "enable_cueq": False,
    }