#Number of iterations for the GenML workflow
num_iterations: 1

#Parameters for MatterGen generate job (use MatterGen or RSS to generate structures)
mattergen_params:
  results_path: MatGenStructures
  "model_path": /leonardo_scratch/fast/EUHPC_A04_113/Alberto/GenModels/MatterGen/MatterGen_models/chemical_system_and_hull
  "batch_size": 3
  "num_batches": 2
  "record_trajectories": False
  "properties_to_condition_on": "{'chemical_system' : 'C-O', 'energy_above_hull' : 0.05}"
  "diffusion_guidance_factor": 2.0


