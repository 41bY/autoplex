#       "device" : "cuda"
#   }
#   "dimer" : True

#Parameters for specifying dataset composition job for model ensemble
dataset_params:
  "pre_database_dir" : None
  "init_database_dir" : None
  "num_models": 4
  "test_ratio": 0.05
  "distill_force_max": 20.0 #eV/Å
  "scf_code": "QE" #Code to use for the scf calculations, e.g. "QE" or "VASP"


#Parameters for the training/fine-tuning of models job in the ensemble 
train_params:
    "num_models": 4
    "remove_model_datasets": True
    "mlip_type": "MACE"
    "mlip_train_kwargs": {
        ###Naive fine-tuning if ONLY foundation model is provided
        # "foundation_model": "/leonardo_work/EUHPC_A04_113/Alberto/GenMLFF-progect/Test-workflow/MACE_models_and_data/MACE-matpes-pbe-omat-ft.model",
        ###Multi-head fine-tuning with these parameters
        # "multiheads_finetuning": True,
        # "pt_train_file": "/leonardo_work/EUHPC_A04_113/Alberto/GenMLFF-progect/Test-workflow/MACE_models_and_data/matpes-pbe-replay-data.xyz",
        # "num_samples_pt": 100,
        # "filter_type_pt": "exclusive",
        # "subselect_pt": "fps",
        # "weight_pt": 1.0,
        # "atomic_numbers": "[6, 8]",
        # "force_mh_ft_lr": true,
        ###Train from scratch if no foundation model is provided
        "energy_key": "energy",
        "forces_key": "forces",
        "device": "cuda",
        "default_dtype": float64, #dtype of the foundation model if fine-tuning
        "batch_size": 1,
        "max_num_epochs": 10,
        "swa": False,
        "E0s": "{6 : -243.0252124389, 8 : -561.5463794436}",
        "enable_cueq": False,
    }