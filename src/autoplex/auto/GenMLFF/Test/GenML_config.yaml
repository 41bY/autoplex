#Parameters for the ensemble evaluator job
ensemble_params:
  "mlip_type": "MACE"
  "mlip_paths": []
  "mlip_errors": []
  "mlip_kwargs": {
      "device" : "cuda", 
      "default_dtype" : "float32",
      }
  "pre_trained_model": "/leonardo_work/EUHPC_A04_113/Alberto/GenMLFF-progect/Test-workflow/MACE_models_and_data/MACE-matpes-pbe-omat-ft.model"
  "pre_trained_kwargs": {
      "device" : "cuda", 
      "default_dtype" : "float32",
  }

#Parameters for sampling job
sampling_params: 
  "num_of_samples": 6 #Number of structures to sample, if double-shot is used, this is an upper bound
  "selection_method": "fps"  # Options: random, uniform, cur, fps, bcur1s, bfps1s, bcur2i, bfps2i
  "soap_params": { #Parameters for SOAP descriptor
      "r_cut": 5.0,
      "n_max": 6,
      "l_max": 6,
      "sigma": 1.0,
      "periodic": True,
      "average": "outer",
  }
  "boltz_params": { #Parameters for Boltzmann sampling
      "kt": 0.3, # Effective temperature in eV
      "boltz_frac": 0.8, # Fraction of structures to be selected by Boltzmann sampling
      "bolt_max_num": 3000, # Maximum number of structures to be selected by Boltzmann sampling
  }
  # "isolated_atom_energies": {'6': '-1.26281801', '8': '-1.54690765'} # MACE-omat isolated atom energies in eV
  "isolated_atom_energies": {'6' : '-243.0252124389', '8' : '-561.5463794436'} # My isolated atom energies in eV
  "random_seed": 42 

#Parameters for QuantumEspresso job: scf runs (Use QuantumEspresso or MLIP to run scf calculations)
qe_params:
  "qe_run_cmd": "mpirun -np 1 pw.x"
  "num_qe_workers": 2 #Number of workers to use for the calculations. If None setp up 1 worker per scf
  "fname_pwi_template": "/leonardo_work/EUHPC_A04_113/Alberto/GenMLFF-progect/Test-workflow/rss-mlip/reference.pwi" #Path to file containing the template QE input
  "kspace_resolution": 0.3 #K-space resolution for the QE calculations in Å^-1
  "koffset": [False, False, False] #K-point offset for the QE calculations
# #Parameters for MLIP scf runs (Use QuantumEspresso or MLIP to run scf calculations)
